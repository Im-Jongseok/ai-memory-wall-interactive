<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="IEEE 출판본의 원문을 보존하고 읽는 부분만 선명하게 강조하는 인터랙티브 논문 리뷰">
  <title>AI and Memory Wall — 원문으로 읽는 논문 리뷰</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="fullscreen-btn" class="fullscreen-button" aria-label="전체 화면 (F)" title="전체 화면 (F)">⛶</button>
  <main id="app">
    <section id="reader" class="reader">
      <div class="reading-layout">
        <div class="source-column">
          <div id="stage" class="stage" tabindex="0" aria-label="논문 원문. 휠과 드래그로 이동하고 Ctrl+휠로 확대할 수 있습니다.">
            <div id="paper" class="paper">
              <img id="paper-image" class="context-image" draggable="false" alt="">
              <img id="focus-image" class="focus-image" draggable="false" alt="" aria-hidden="true">
              <div id="hotspots" class="hotspots"></div>
              <div id="focus-ring" class="focus-ring" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <aside id="interpretation" class="interpretation">
          <div class="scene-heading"><div id="scene-kicker" class="eyebrow"></div><h1 id="scene-title"></h1></div>
          <div id="scene-stat" class="scene-stat"></div>
          <p id="scene-body" class="scene-body"></p>
          <div id="figure-tabs" class="figure-tabs" hidden><div class="tab-buttons"><button data-go="fig3a">FLOPs</button><button data-go="fig3b">MOPs</button><button data-go="fig3c">AI</button><button data-go="fig3d">Latency</button></div><p class="condition">Intel Gold 6242 CPU · batch 1<br>비교 기준: sequence length 128</p></div>
          <div id="notes-panel" class="notes-panel" hidden><div class="eyebrow">PRESENTER NOTES</div><div id="scene-notes"></div></div>
          <div id="source-reference" class="source-reference" hidden><a href="https://ieeexplore.ieee.org/document/10477550" target="_blank" rel="noopener">IEEE 원문 보기 ↗</a><a href="assets/AI-and-Memory-Wall-IEEE.pdf" target="_blank" rel="noopener">제공된 PDF 열기 ↗</a></div>
        </aside>
      </div>
    </section>
  </main>
  <footer class="presentation-controls"><button id="prev-btn" class="navigation-button" aria-label="이전 장면 (왼쪽 화살표)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button><button id="next-btn" class="navigation-button" aria-label="다음 장면 (오른쪽 화살표)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14m-7-7 7 7-7 7"/></svg></button></footer>
  <div id="live-status" class="sr-only" aria-live="polite"></div><div id="toast" class="toast" role="status"></div>
  <dialog id="page-dialog" class="page-dialog"><div class="dialog-top"><h2>원문 페이지 탐색</h2><button class="dialog-close icon-button" aria-label="닫기">×</button></div><div id="explorer-pages" class="page-grid"></div></dialog>
  <dialog id="help-dialog" class="help-dialog"><div class="dialog-top"><h2>발표 단축키</h2><button class="dialog-close icon-button" aria-label="닫기">×</button></div><div class="shortcut-list"><p><span>이전 / 다음 장면</span><kbd>← / →</kbd></p><p><span>다음 장면</span><kbd>Space</kbd></p><p><span>전체 페이지 ↔ 확대</span><kbd>O</kbd></p><p><span>원문만 크게 보기</span><kbd>T</kbd></p><p><span>발표자 노트</span><kbd>N</kbd></p><p><span>원문 페이지 탐색</span><kbd>M</kbd></p><p><span>전체 화면</span><kbd>F</kbd></p><p><span>처음 / 끝</span><kbd>Home / End</kbd></p></div><p class="help-bottom">휠·드래그로 이동하고 Ctrl+휠로 확대하세요.<br>숫자 0은 현재 장면에 맞추고, O는 전체 원문으로 돌아갑니다.</p></dialog>
  <script src="content.js"></script><script src="app.js"></script>
</body>
</html>
